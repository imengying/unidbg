name: Publish (Release + Docker Hub)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAVEN_VERSION: 3.9.16
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Maven 3.9.16
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          BASE_URL="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}"

          curl -fsSL "${BASE_URL}/${ARCHIVE}" -o "${RUNNER_TEMP}/${ARCHIVE}"
          curl -fsSL "${BASE_URL}/${ARCHIVE}.sha512" -o "${RUNNER_TEMP}/${ARCHIVE}.sha512"

          echo "$(tr -d '[:space:]' < "${RUNNER_TEMP}/${ARCHIVE}.sha512")  ${RUNNER_TEMP}/${ARCHIVE}" | sha512sum -c -

          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify Maven version
        run: mvn -version

      - name: Build and verify jar
        run: mvn --batch-mode --no-transfer-progress clean verify -Dmaven.test.skip=false

      - name: Generate checksums
        working-directory: target
        run: sha256sum fqnovel.jar > fqnovel.jar.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF_NAME}"
          TARGET="target/fqnovel.jar"
          CHECKSUM="target/fqnovel.jar.sha256"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${TARGET}" "${CHECKSUM}" --clobber
          else
            gh release create "${TAG_NAME}" "${TARGET}" "${CHECKSUM}" \
              --target "${GITHUB_SHA}" \
              --title "${TAG_NAME}"
          fi

      - name: Set up QEMU
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/setup-qemu-action@v4.0.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/setup-buildx-action@v4.0.0

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4.0.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/unidbg-fq
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push (Docker Hub)
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Docker push skipped (missing secrets)
        if: ${{ env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == '' }}
        run: |
          echo "Docker Hub secrets not set; skip pushing image."
          echo "Set: Settings -> Secrets and variables -> Actions -> DOCKERHUB_USERNAME / DOCKERHUB_TOKEN"
